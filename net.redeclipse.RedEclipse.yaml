id: net.redeclipse.RedEclipse
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: redeclipse
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --persist=.redeclipse
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - '*.la'
  - '*.a'
modules:

  - name: enet
    sources:
      - type: archive
        url: http://enet.bespin.org/download/enet-1.3.18.tar.gz
        sha256: 2a8a0c5360d68bb4fcd11f2e4c47c69976e8d2c85b109dd7d60b1181a4f85d36

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: SDL2_mixer
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2MIXER_MOD=OFF
      - -DSDL2MIXER_MIDI=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.2/SDL2_mixer-2.8.2.tar.gz
        sha256: 938dff531d00ace2296557a6599abe6f34599e2f34f0a4a08a397e2ccac8b8f7

  - name: redeclipse
    buildsystem: cmake-ninja
    no-make-install: true
    subdir: src
    sources:
      - type: archive
        url: https://github.com/redeclipse/base/releases/download/v1.6.0/redeclipse_1.6.0_nix.tar.bz2
        sha256: 48a947e858587116b7d177cf18148d0d9e40b1c5b481e2c955baed68cffc2849
      - type: file
        path: redeclipse.sh
      - type: file
        path: net.redeclipse.RedEclipse.png
      - type: file
        path: net.redeclipse.RedEclipse.desktop
      - type: patch
        paths:
          - patches/cmakelists.patch
          - patches/gcc16.patch
          - patches/remove-gamma-name-hack.patch
    post-install:
      - install -Dm755 ../redeclipse.sh /app/bin/redeclipse
      - install -Dm755 redeclipse_linux -t /app/share/redeclipse
      - cp -a ../config ../data /app/share/redeclipse
      - install -Dm644 ../net.redeclipse.RedEclipse.png -t /app/share/icons/hicolor/512x512/apps
      - install -Dm644 ../net.redeclipse.RedEclipse.desktop -t /app/share/applications
